name: Hardware farm

# Runs the test suite on real consoles once a night, on main's head if it has
# no hwfarm/ps1 result yet, and reports it as that commit status. A full run is
# about 47 leases on shared consoles, which is too many to spend per push. Post-merge only and never a required check:
# the farm's consoles share one runner that can wedge, and on those incident
# paths its result envelope cannot tell a regression from a sick farm. So an
# infrastructure outcome (heartbeat_timeout, lease_timeout, runner_lost, ...)
# posts "error", and only a verdict the test program produced posts "failure".
# The classification lives in .github/scripts/hwfarm.js.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# A newer run supersedes an older one. Tickets already on the farm finish
# there regardless; the CLI has no cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '[.statuses[] | select(.context == "hwfarm/ps1") | .state][0] // ""')
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$state" ] || [ "$state" = error ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "hwfarm/ps1 is already $state on ${{ github.sha }}"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      # No PCSX_TESTS: on hardware every case runs, including the ones gated
      # off for the emulator.
      - name: Tests
        run: make -C tests -j2 all

      - uses: actions/upload-artifact@v4
        with:
          name: hwfarm-tests
          path: tests/**/*.ps-exe
          retention-days: 7

  farm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          name: hwfarm-tests
          path: tests

      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'hwfarm/ps1', state: 'pending', description: 'submitted to the PS1 farm',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - name: Run on the farm
        env:
          HWTEST_TOKEN: ${{ secrets.HWTEST_TOKEN }}
        run: node .github/scripts/hwfarm.js run --out hwfarm-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwfarm-results
          path: hwfarm-results.json
          if-no-files-found: ignore

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = { state: 'error', description: 'INFRASTRUCTURE: the farm run did not produce results' };
            if (`${{ job.status }}` === 'cancelled') summary.description = 'cancelled: superseded by a newer push';
            else if (fs.existsSync('hwfarm-results.json')) summary = JSON.parse(fs.readFileSync('hwfarm-results.json')).summary;
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'hwfarm/ps1', state: summary.state, description: summary.description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
