name: Hardware farm

# Runs the test suite on real consoles once a night, on main's head if it has
# no hwfarm/ps1 result yet, and reports it as that commit status. A full run is
# about 47 leases on shared consoles, which is too many to spend per push. Post-merge only and never a required check:
# the farm's consoles share one runner that can wedge, and on those incident
# paths its result envelope cannot tell a regression from a sick farm. So an
# infrastructure outcome (heartbeat_timeout, lease_timeout, runner_lost, ...)
# posts "error", and only a verdict the test program produced posts "failure".
# The classification lives in .github/scripts/hwfarm.js.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# A newer run supersedes an older one. Tickets already on the farm finish
# there regardless; the CLI has no cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '[.statuses[] | select(.context == "hwfarm/ps1") | .state][0] // ""')
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$state" ] || [ "$state" = error ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "hwfarm/ps1 is already $state on ${{ github.sha }}"
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      # No PCSX_TESTS: on hardware every case runs, including the ones gated
      # off for the emulator.
      - name: Tests
        run: make -C tests -j2 all

      - uses: actions/upload-artifact@v4
        with:
          name: hwfarm-tests
          path: tests/**/*.ps-exe
          retention-days: 7

  farm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v4
        with:
          name: hwfarm-tests
          path: tests

      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'hwfarm/ps1', state: 'pending', description: 'submitted to the PS1 farm',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      # Exit 2 is the manifest gate: a ps-exe in neither TESTS nor SKIPS, or a
      # listed one that was not built. Nothing is submitted, the job fails, and
      # the step below opens an issue so the refusal is not just a status.
      - name: Run on the farm
        id: farm
        env:
          HWTEST_TOKEN: ${{ secrets.HWTEST_TOKEN }}
        run: |
          code=0
          node .github/scripts/hwfarm.js run --out hwfarm-results.json || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwfarm-results
          path: hwfarm-results.json
          if-no-files-found: ignore

      # One open issue per refusal: a later run comments on it instead of
      # opening another.
      - name: Open an issue for a manifest refusal
        if: failure() && steps.farm.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='hwfarm nightly: manifest refused the run'
          {
            echo "The hardware farm run on ${GITHUB_SHA::12} submitted nothing: the manifest gate in .github/scripts/hwfarm.js refused it. $RUN_URL"
            if [ -f hwfarm-results.json ]; then
              if jq -e '.refused.unlisted | length > 0' hwfarm-results.json > /dev/null; then
                echo
                echo 'Unlisted, each needs a line in TESTS or SKIPS:'
                jq -r '.refused.unlisted[] | "- `\(.)`"' hwfarm-results.json
              fi
              if jq -e '.refused.missing | length > 0' hwfarm-results.json > /dev/null; then
                echo
                echo 'Listed but not built:'
                jq -r '.refused.missing[] | "- `\(.)`"' hwfarm-results.json
              fi
            else
              echo
              echo 'hwfarm.js exited 2 without writing a results file; see the run log.'
            fi
          } > refusal.md
          cat refusal.md
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body-file refusal.md
          else
            gh issue create -R "$REPO" --title "$title" --body-file refusal.md
          fi

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = { state: 'error', description: 'INFRASTRUCTURE: the farm run did not produce results' };
            if (`${{ job.status }}` === 'cancelled') summary.description = 'cancelled: superseded by a newer push';
            else if (fs.existsSync('hwfarm-results.json')) summary = JSON.parse(fs.readFileSync('hwfarm-results.json')).summary;
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: context.sha,
              context: 'hwfarm/ps1', state: summary.state, description: summary.description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
