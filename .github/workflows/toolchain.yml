name: Toolchain

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/linux-mips/**'
      - '.github/workflows/toolchain.yml'
  pull_request:
    paths:
      - 'tools/linux-mips/**'
      - '.github/workflows/toolchain.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
      - name: Update packages registry
        run: sudo apt-get update
      - name: Install pre-reqs
        run: sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev
      - name: Build toolchains
        working-directory: /tmp
        run: sudo bash $GITHUB_WORKSPACE/tools/linux-mips/spawn-compiler.sh
      - name: Build OpenBIOS with it
        run: make -C openbios -j 6 all
      - name: Build psyqo examples with it
        run: for d in psyqo/examples/* psyqo-paths/examples/* psyqo-lua/examples/*; do if [ -f "$d/Makefile" ]; then make -C "$d" -j 6 all TEST=true; fi; done
