name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rfc-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/rfc.test.js .github/scripts/hwfarm.test.js

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true

      - name: OpenBIOS
        run: make -C openbios -j2 all

      - name: Libraries and examples
        # cube is left out: it links against the converted Sony libraries,
        # which are not redistributable and have to be built locally. See
        # psyq/README.md.
        run: |
          for d in crc32 cxxhello helloworld modplayer psmplayer psyqo \
                   psyqo-lua psyqo-paths scratchstack shell shello spdplayer gpdplayer ucl-demo; do
            echo "::group::$d"
            make -C $d -j2 all
            echo "::endgroup::"
          done

      - name: Tests
        run: make -C tests -j2 all PCSX_TESTS=true

      - name: Emulator
        # The dev channel AppImage, extracted because a runner has no FUSE.
        run: |
          curl -sL -o pcsx-redux.zip https://distrib.app/pub/org/pcsx-redux/project/dev-linux-x64/latest
          unzip -q pcsx-redux.zip
          ./PCSX-Redux-*.AppImage --appimage-extract > /dev/null

      - name: Run tests
        run: tests/run-emulator.sh "$GITHUB_WORKSPACE/squashfs-root/AppRun" openbios/openbios.bin

  psxdemo:
    # A downstream build: nugget's own suite can stay green while breaking a
    # project that consumes it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    container: ghcr.io/grumpycoders/pcsx-redux-build:latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: nugget
          submodules: recursive
          set-safe-directory: true
          persist-credentials: false

      - name: psxdemo against this nugget
        # Build-only. psxdemo packs its parts with ps1-packer, which this image
        # does not have, so a stub copies each input through to its -o output.
        # The result does not run; the job checks that it compiles and links.
        run: |
          git clone -q --depth 1 https://github.com/rixnobis/psxdemo
          rm -rf psxdemo/third_party/nugget
          ln -s "$GITHUB_WORKSPACE/nugget" psxdemo/third_party/nugget
          printf '#!/bin/sh\nin="$1"; out=""\nwhile [ $# -gt 0 ]; do [ "$1" = "-o" ] && out="$2"; shift; done\ncp "$in" "$out"\n' > stub-packer
          chmod +x stub-packer
          make -C psxdemo -j2 PS1PACKER="$PWD/stub-packer"
          ls -l psxdemo/demo.ps-exe
